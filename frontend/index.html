<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tênis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    
    <div class="container">

        <h1>👟 Explorador de Tênis</h1>
        <p class="subtitle">Consumindo nossa própria API em Node.js</p>

        <div class="tenis-area">
            <img src="" alt="Tênis" id="tenisImage">
            <div id="breedName"></div>
        </div>

        <div class="controls">
            <button id="randomBtn">🎲 Tênis Aleatório</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="breedInput"
                placeholder="Digite um nome de tênis (ex: Air Force, New Balance, Asics, LV)"
            >
            <button id="searchBtn">🔍 Buscar</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>

</body>
</html>
